[package]
name = "qingqiuyue-desktop"
version = "0.1.0"
description = "清秋月桌面客户端"
authors = ["qingqiuyue team"]
edition = "2021"

[lib]
name = "qingqiuyue_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
# 微信授权只能在系统浏览器里完成(客户端自带的 WebView 过不了微信登录),
# 授权完得靠 qingqiuyue:// 这个自定义协议把人送回 App。
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
# open crate 已不再使用,open_external 改走 shell 插件(安卓也能开系统浏览器)

# 桌面端单实例:Windows/Linux 上点 qingqiuyue:// 链接,系统会再拉起一个新进程;
# 开了 deep-link feature 后,新进程把链接转给已在运行的那个实例(触发 on_open_url)然后自己退出,
# 不然回跳落到新进程里,发起登录的那个窗口永远等不到。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
