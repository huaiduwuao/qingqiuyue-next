name: Build & Release

# push/PR 只跑前端检查;各平台安装包只在打 v* tag 或手动触发时构建(macOS runner 很贵)。
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HUSKY: '0'
  # 与 Dockerfile 一致:本包不是 workspace,pnpm-workspace.yaml 只放 allowBuilds
  PNPM_CONFIG_IGNORE_WORKSPACE: 'true'

jobs:
  # ==================== 前端检查 ====================
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: ESLint
        # 现存 33 个 lint error,清完之前不拦构建
        continue-on-error: true
        run: pnpm lint

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm app:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30

  # ==================== macOS (Universal) ====================
  build-macos:
    runs-on: macos-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build (ad-hoc signed)
        if: env.HAS_APPLE_CERT != 'true'
        run: pnpm app:macos
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Build (Developer ID signed + notarized)
        if: env.HAS_APPLE_CERT == 'true'
        run: pnpm app:macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  # ==================== iOS(需配置 Apple 开发者账号后才运行) ====================
  build-ios:
    runs-on: macos-latest
    needs: frontend-check
    if: vars.APPLE_DEVELOPMENT_TEAM != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Generate Xcode project if not committed
        run: test -d src-tauri/gen/apple || pnpm app:ios:init
      - run: pnpm app:ios --export-method app-store-connect
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: src-tauri/gen/apple/build/arm64/*.ipa
          retention-days: 30

  # ==================== Android(手机 + TV 同一个包) ====================
  build-android:
    runs-on: ubuntu-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      NDK_VERSION: 27.0.12077973
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK + AAB
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" pnpm app:android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "::error::keystore configured but APK is unsigned: $apk"; exit 1;; esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          retention-days: 30

  # ==================== GitHub Release(仅 v* tag) ====================
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # GitHub 会吞掉资源名里的中文产品名(变成 _1.0.1_x64-setup.exe)。统一成固定的英文文件名,
      # 官网下载页用 releases/latest/download/<文件名>,每次发版后自动指向最新版,无需改网站。
      - name: Stable file names
        run: |
          mkdir dist
          pick() {
            f=$(find "artifacts/$1" -name "$2" | head -1)
            [ -n "$f" ] || { echo "missing $1/$2"; exit 1; }
            cp "$f" "dist/$3"
          }
          pick windows '*-setup.exe' qingqiuyue-windows-x64-setup.exe
          pick windows '*.msi'       qingqiuyue-windows-x64.msi
          pick macos   '*.dmg'       qingqiuyue-macos-universal.dmg
          pick android '*.apk'       qingqiuyue-android.apk
          pick android '*.aab'       qingqiuyue-android.aab
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
