name: Build & Release

# push/PR 只跑前端检查;各平台安装包只在打 v* tag 或手动触发时构建(macOS runner 很贵)。
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR 上旧 run 直接取消(改一版推一版,便宜的反馈);push / tag 上不取消 —— tag 之间 ref 不同,
  # 本来就各跑各的,正在发布的那次不会被后续 push 打断。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  HUSKY: '0'
  # 与 Dockerfile 一致:本包不是 workspace,pnpm-workspace.yaml 只放 allowBuilds
  PNPM_CONFIG_IGNORE_WORKSPACE: 'true'

jobs:
  # ==================== 前端检查 ====================
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      # 版本只认 package.json 的 packageManager(pnpm 10);这里再写 version 会直接报
      # "Multiple versions of pnpm specified" 并中断整个工作流
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: ESLint
        # 存量 error 已清零(warning 不影响退出码),从此 lint error 直接拦构建
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      # 与 Dockerfile 同一条构建路径(NEXT_EXPORT_STATIC=true → 静态导出到 out/),
      # 线上跑的就是这个产物;普通 next build 过了不代表静态导出能过
      - name: Build (static export)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: https://qingqiuyue.com
        run: pnpm build:static

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      # 版本只认 package.json 的 packageManager(pnpm 10);这里再写 version 会直接报
      # "Multiple versions of pnpm specified" 并中断整个工作流
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # 自动更新包(latest.json 用的 .sig / .app.tar.gz)要用 updater 私钥签名。
      # 有 TAURI_SIGNING_PRIVATE_KEY 才打开 bundle.createUpdaterArtifacts;没配就写一个空的覆盖文件,
      # 构建和以前完全一样 —— 缺 secret 绝不能卡住发版。提交的 tauri.conf.json 里不开这个开关,
      # 本地没有私钥也能照常打包。--config 传文件路径而不是内联 JSON:Windows 上 pnpm 经 cmd 转发时会把 JSON 的引号拆坏。
      - name: Updater artifacts config
        shell: bash
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.ci-updater.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置:本次不生成自动更新包,发版里不会有 latest.json"
            echo '{}' > src-tauri/tauri.ci-updater.conf.json
          fi
      - run: pnpm app:windows --config src-tauri/tauri.ci-updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows 的自动更新直接用 NSIS 安装包(*-setup.exe)+ 它的 .sig;没开 updater 时 .sig 不存在,通配不到就算了
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30

  # ==================== macOS (Universal) ====================
  build-macos:
    runs-on: macos-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      # 版本只认 package.json 的 packageManager(pnpm 10);这里再写 version 会直接报
      # "Multiple versions of pnpm specified" 并中断整个工作流
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # 自动更新包(latest.json 用的 .sig / .app.tar.gz)要用 updater 私钥签名。
      # 有 TAURI_SIGNING_PRIVATE_KEY 才打开 bundle.createUpdaterArtifacts;没配就写一个空的覆盖文件,
      # 构建和以前完全一样 —— 缺 secret 绝不能卡住发版。提交的 tauri.conf.json 里不开这个开关,
      # 本地没有私钥也能照常打包。--config 传文件路径而不是内联 JSON:Windows 上 pnpm 经 cmd 转发时会把 JSON 的引号拆坏。
      - name: Updater artifacts config
        shell: bash
        run: |
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.ci-updater.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置:本次不生成自动更新包,发版里不会有 latest.json"
            echo '{}' > src-tauri/tauri.ci-updater.conf.json
          fi
      - name: Build (ad-hoc signed)
        if: env.HAS_APPLE_CERT != 'true'
        run: pnpm app:macos --config src-tauri/tauri.ci-updater.conf.json
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build (Developer ID signed + notarized)
        if: env.HAS_APPLE_CERT == 'true'
        run: pnpm app:macos --config src-tauri/tauri.ci-updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # .app.tar.gz(+ .sig)是 macOS 的自动更新包,universal 构建,darwin-x86_64 / aarch64 共用
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  # ==================== iOS(需配置 Apple 开发者账号后才运行) ====================
  build-ios:
    runs-on: macos-latest
    needs: frontend-check
    if: vars.APPLE_DEVELOPMENT_TEAM != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      # 版本只认 package.json 的 packageManager(pnpm 10);这里再写 version 会直接报
      # "Multiple versions of pnpm specified" 并中断整个工作流
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Generate Xcode project if not committed
        run: test -d src-tauri/gen/apple || pnpm app:ios:init
      - run: pnpm app:ios --export-method app-store-connect
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: src-tauri/gen/apple/build/arm64/*.ipa
          retention-days: 30

  # ==================== Android(手机 + TV 同一个包) ====================
  build-android:
    runs-on: ubuntu-latest
    needs: frontend-check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      NDK_VERSION: 27.0.12077973
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # 同 .dockerignore:pnpm 9 读到没有 packages 字段的 workspace 文件会直接报错
      # (setup-node 缓存步骤里的 `pnpm store path` 也会),CI 里和镜像构建一样去掉它
      - name: Drop pnpm-workspace.yaml
        shell: bash
        run: rm -f pnpm-workspace.yaml
      # 版本只认 package.json 的 packageManager(pnpm 10);这里再写 version 会直接报
      # "Multiple versions of pnpm specified" 并中断整个工作流
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 这个 action 默认装 `tools platform-tools`,而 `tools` 早已废弃、Google 仓库里
      # 已经找不到(Failed to find package 'tools' → sdkmanager 退出 1,整个任务挂掉)。
      # 只留 platform-tools,其余组件下一步自己装。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 只出 arm64-v8a:x86/x86_64 是模拟器专用,armeabi-v7a 是 2015 年前的 32 位机
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK + AAB
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" pnpm app:android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "::error::keystore configured but APK is unsigned: $apk"; exit 1;; esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab
          retention-days: 30

  # ==================== GitHub Release(仅 v* tag) ====================
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # GitHub 会吞掉资源名里的中文产品名(变成 _1.0.1_x64-setup.exe)。统一成固定的英文文件名,
      # 官网下载页用 releases/latest/download/<文件名>,每次发版后自动指向最新版,无需改网站。
      - name: Stable file names
        run: |
          mkdir dist
          pick() {
            f=$(find "artifacts/$1" -name "$2" | head -1)
            [ -n "$f" ] || { echo "missing $1/$2"; exit 1; }
            cp "$f" "dist/$3"
          }
          pick windows '*-setup.exe' qingqiuyue-windows-x64-setup.exe
          pick windows '*.msi'       qingqiuyue-windows-x64.msi
          pick macos   '*.dmg'       qingqiuyue-macos-universal.dmg
          pick android '*.apk'       qingqiuyue-android.apk
          pick android '*.aab'       qingqiuyue-android.aab
          # 自动更新包:只有配了 TAURI_SIGNING_PRIVATE_KEY 才会有 .sig。包和签名必须成对,缺一个就整个平台不进 latest.json。
          # Windows 用的就是上面那个 setup.exe 本身,这里只补它的签名。
          pair() {
            f=$(find "artifacts/$1" -name "$2" | head -1)
            s=$(find "artifacts/$1" -name "$2.sig" | head -1)
            if [ -n "$f" ] && [ -n "$s" ]; then
              cp "$f" "dist/$3"; cp "$s" "dist/$3.sig"
            else
              echo "::warning::$1 没有自动更新包/签名($2),这个平台不进 latest.json"
            fi
          }
          pair windows '*-setup.exe'   qingqiuyue-windows-x64-setup.exe
          pair macos   '*.app.tar.gz'  qingqiuyue-macos-universal.app.tar.gz
          ls -l dist
      # 附件上传偶发失败(v1.1.0 时 GitHub 直接回了一页 HTML 错误页,两次都挂在 .aab 上),
      # 而 action-gh-release 一个附件失败就整个任务红掉,只留下一个传了一半的草稿。
      # 改成:先建草稿 → 逐个上传、每个最多重试 3 次 → 五个齐了才转正式发布。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 不 checkout(只下载各平台产物),没有 .git 可推断仓库,
          # gh 会直接死在 `failed to run git: fatal: not a git repository`。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --generate-notes --title "$TAG"

          # ---- latest.json(Tauri 静态更新清单)----
          # 地址用带 tag 的 releases/download/<tag>/…,不用 latest:客户端下到的永远是清单描述的那一个包。
          # 说明优先取 tag 的注解,没有(轻量 tag)就用 release 正文(--generate-notes 生成的)。
          # 一个 .sig 都没有(没配 TAURI_SIGNING_PRIVATE_KEY)就不出 latest.json —— Tauri 不认没有 platforms 的清单;
          # 安卓端的检查会退回 GitHub releases/latest API,不受影响。
          if ls dist/*.sig >/dev/null 2>&1; then
            notes=""
            ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" -q '.object.type + " " + .object.sha' 2>/dev/null || true)
            if [ "${ref%% *}" = "tag" ]; then
              notes=$(gh api "repos/$GH_REPO/git/tags/${ref#* }" -q .message 2>/dev/null | sed '/-----BEGIN PGP SIGNATURE-----/,$d' || true)
            fi
            [ -n "$(echo "$notes" | tr -d '[:space:]')" ] || notes=$(gh release view "$TAG" --json body -q .body || true)
            base="https://github.com/$GH_REPO/releases/download/$TAG"
            platforms='{}'
            add() {
              platforms=$(jq -c --arg k "$1" --arg url "$base/$2" --rawfile sig "dist/$2.sig" \
                '. + {($k): {signature: ($sig | rtrimstr("\n")), url: $url}}' <<<"$platforms")
            }
            [ -f dist/qingqiuyue-windows-x64-setup.exe.sig ] && add windows-x86_64 qingqiuyue-windows-x64-setup.exe
            if [ -f dist/qingqiuyue-macos-universal.app.tar.gz.sig ]; then
              add darwin-x86_64 qingqiuyue-macos-universal.app.tar.gz
              add darwin-aarch64 qingqiuyue-macos-universal.app.tar.gz
            fi
            jq -n --arg version "${TAG#v}" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson platforms "$platforms" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > dist/latest.json
            jq '.platforms | keys' dist/latest.json
          else
            echo "::warning::没有任何 .sig(TAURI_SIGNING_PRIVATE_KEY 未配置?),本次不发布 latest.json,桌面端不会收到自动更新"
          fi

          for f in dist/*; do
            for i in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber && continue 2
              echo "upload failed ($i/3): $f"
              sleep 15
            done
            echo "::error::upload gave up after 3 tries: $f"
          done
          # 固定的 5 个安装包 + (有签名时)更新包 / .sig / latest.json,dist 里的每一个都得在 release 上
          names=$(gh release view "$TAG" --json assets -q '.assets[].name')
          want=$(ls dist | wc -l)
          missing=0
          for f in dist/*; do
            grep -qxF "$(basename "$f")" <<<"$names" || { echo "::error::附件没传上去:$(basename "$f")"; missing=$((missing + 1)); }
          done
          echo "uploaded assets: $((want - missing))/$want"
          [ "$want" -ge 5 ] && [ "$missing" -eq 0 ] || { echo "::error::附件不齐,不发布"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
