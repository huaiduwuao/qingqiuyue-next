services:
  # =============================================
  # qingqiuyue-next 前端(Next.js standalone,:3000)
  # /api/* 与 /logs/* 由 Next 服务端反代到后端 APISIX 网关。
  #
  # ⚠️ 推荐统一用 qingqiuyue-go 的 `make compose-up` 一并构建启动前端(web 已并入
  #    后端业务 compose)。本文件仅供前端单独起;两者别同时跑(container_name 冲突)。
  # =============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/qingqiuyue/web:latest
    container_name: qingqiuyue-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 直连后端 APISIX(同一容器网络,DNS 名 apisix,内部端口 9080),不绕宿主机
      - API_PROXY_TARGET=http://apisix:9080
    networks:
      - backend

networks:
  # 接入基础设施创建的 qingqiuyue 网络(apisix 就在这张网上,DNS 名 apisix 可解析)。
  # ⚠️ 必须用 qingqiuyue,不能用 docker_default —— 拆分 infra/业务 compose 后
  #    apisix 只挂 qingqiuyue,放 docker_default 会 ENOTFOUND apisix 导致 /api 反代 500。
  # 需先 `make compose-infra-up` 起基础设施(创建该网络)。
  backend:
    external: true
    name: qingqiuyue
