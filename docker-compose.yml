services:
  # =============================================
  # qingqiuyue-next 前端(Next.js standalone,:3000)
  # /api/* 与 /logs/* 由 Next 服务端反代到后端 APISIX 网关。
  #
  # 前端独立启动:先 `make compose-infra-up`(建 qingqiuyue 网 + apisix),
  # 再在本目录 `make compose-up`。web 接入下方 qingqiuyue 网,与 apisix 同网。
  # =============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/qingqiuyue/web:latest
    container_name: qingqiuyue-web
    restart: unless-stopped
    ports:
      # 宿主 10809 → 容器内 3000(容器仍监听 3000,改这里不用重建镜像)
      - "10809:3000"
    environment:
      # 直连后端 APISIX(同一容器网络,DNS 名 apisix,内部端口 9080),不绕宿主机
      - API_PROXY_TARGET=http://apisix:9080
      # audio-gateway 与 web 同属 qingqiuyue 网络,服务端代理用服务名访问
      - AUDIO_GATEWAY_BASE_URL=http://audio-gateway:8001/v1
      # === 数字人 Web 流水线 ===
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-qingqiuyue}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-qingqiuyue123}
      - MINIO_BUCKET=qingqiuyue-avatars
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - MINIO_PUBLIC_USE_SSL=${MINIO_PUBLIC_USE_SSL:-false}
      - AVATAR_WORK_ROOT=/data/avatar-work
      - MAX_CONCURRENT_PIPELINES=${MAX_CONCURRENT_PIPELINES:-2}
      - AVATAR_JOB_TTL_MIN=${AVATAR_JOB_TTL_MIN:-30}
      - JWT_SECRET=${JWT_SECRET:-please-change-me-to-a-long-random-string}
    networks:
      - backend
    volumes:
      # 数字人管线工作目录(input.mp4 / 中间产物 / deploy)
      - avatar-work:/data/avatar-work

volumes:
  avatar-work:

networks:
  # 接入基础设施创建的 qingqiuyue 网络(apisix 就在这张网上,DNS 名 apisix 可解析)。
  # ⚠️ 必须用 qingqiuyue,不能用 docker_default —— 拆分 infra/业务 compose 后
  #    apisix 只挂 qingqiuyue,放 docker_default 会 ENOTFOUND apisix 导致 /api 反代 500。
  # 需先 `make compose-infra-up` 起基础设施(创建该网络)。
  backend:
    external: true
    name: qingqiuyue
