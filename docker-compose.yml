services:
  # =============================================
  # qingqiuyue-next 前端(Next.js standalone,:3000)
  # /api/* 由 Next 服务端反代到后端 APISIX 网关
  # =============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/qingqiuyue/web:latest
    container_name: qingqiuyue-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 直连后端 APISIX(同一容器网络,DNS 名 apisix,内部端口 9080),不绕宿主机
      - API_PROXY_TARGET=http://apisix:9080
    networks:
      - backend

networks:
  # 复用后端 compose(qingqiuyue-go/docker)创建的网络 docker_default
  # 需先启动后端(make compose-up)再起前端
  backend:
    external: true
    name: docker_default
