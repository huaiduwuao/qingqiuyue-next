# 搜索引擎爬虫:访问 SPA 详情页时给同一内容的服务端直出页(内容一致,见 qingqiuyue-go internal/seo)。
# 爬虫基本不跑 JS,SPA 详情页对它们只有「清秋月」三个字。
map $http_user_agent $qq_is_spider {
    default 0;
    ~*(baiduspider|googlebot|bingbot|sogou|360spider|haosouspider|bytespider|yisouspider|yandexbot|duckduckbot|petalbot|applebot|slurp) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前面是 edge(qingqiuyue-go docker/edge,不随部署重建):它从 podman 网络 qingqiuyue 连过来,
    # 把真实来源放在 X-Real-IP 里。信任它,$remote_addr / 访问日志 / 下面转给 APISIX 的
    # X-Real-IP、X-Forwarded-For 才和以前(CDN 直连 10809)一样。
    set_real_ip_from 10.89.0.0/24;
    real_ip_header X-Real-IP;

    # ── 安全响应头 ──────────────────────────────────────────────────────────
    # ⚠️ nginx 的 add_header 只在「本层没有任何 add_header」时才继承上层:下面自带 add_header 的
    #   location(静态资源 / .html)必须把这一组原样再抄一遍,改这里记得同步。
    # - frame-ancestors / X-Frame-Options:/system/* 后台不能被别的站套进 iframe 点击劫持;
    #   数字人场景屏会用同源 iframe 开站内页面,所以是 'self' 不是 'none'。
    # - HSTS:这里监听的是 80,TLS 在前面的网关终结;浏览器只认 https 响应里的 HSTS。
    # - 完整 CSP 先用 Report-Only:静态导出的每个 HTML 都带 Next 的内联 <script>(self.__next_f.push),
    #   内容随页面变,nginx 发不了 nonce,script-src 'self' 一上就整站白屏;数字人 vrm/config/loader.ts
    #   还用 new Function 算动作公式。先观察,等内联脚本改成构建期 hash 后再切成强制。
    #   MUI / emotion 运行时插 <style>,style-src 离不开 'unsafe-inline';图片 / 视频 / 内嵌网页
    #   来自爬虫抓的任意站点,img/media/frame 只能放开 https/http。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https: wss:; frame-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # SPA fallback - 支持多级路由
    location / {
        # 尝试直接文件、目录，最后回退到 index.html
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    # ── SEO(qingqiuyue-go internal/seo):服务端直出的内容页 / 热点专题 / 站点地图 / robots ──
    location ~ ^/w/([0-9]+)$ {
        proxy_pass http://10.9.1.2:10005/api/content/seo/w/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /hot {
        proxy_pass http://10.9.1.2:10005/api/content/seo/hot$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/hot/([0-9a-z-]+)$ {
        proxy_pass http://10.9.1.2:10005/api/content/seo/hot/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/c/([a-z-]+)(/[gy]/[0-9a-z_-]+)?$ {
        proxy_pass http://10.9.1.2:10005/api/content/seo/c/$1$2$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/p/([^/]+)$ {
        proxy_pass http://10.9.1.2:10005/api/content/seo$request_uri; # 保留百分号编码的中文名
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /sitemap.xml {
        proxy_pass http://10.9.1.2:10005/api/content/seo/sitemap.xml;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemaps/([A-Za-z0-9._-]+)$ {
        proxy_pass http://10.9.1.2:10005/api/content/seo/sitemaps/$1;
        proxy_set_header Host $host;
    }
    # IndexNow 密钥文件(32 位十六进制 + .txt,必须在根目录)
    location ~ "^/([0-9a-f]{32}\.txt)$" {
        proxy_pass http://10.9.1.2:10005/api/content/seo/indexnow/$1;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://10.9.1.2:10005/api/content/seo/robots.txt;
        proxy_set_header Host $host;
    }
    # 爬虫访问 SPA 详情页 → 同一内容的直出页;普通访客照旧走静态页。
    location ~ ^/detail/[a-z-]+-detail$ {
        if ($qq_is_spider) {
            rewrite ^ /w/$arg_id last;
        }
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
    }

    # CORS 预检请求处理
    location ^~ /api/ {
        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT, X-Mx-ReqToken, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization, X-Request-ID, X-CSRF-Token';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # ⚠️ 代理到新 APISIX(10.9.1.2:10005)。
        #   旧 `apisix:9080` 指向历史遗留的 apisix 容器(路由过期 → 502)。
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/proxy:后端把外站图片 / 视频流转一道(补 Referer)。
    #   类型白名单、nosniff、CSP sandbox 都由后端(stream_proxy.go)自己发:它会先把 octet-stream /
    #   text/plain 但内容是图片的响应改成真实类型再带 nosniff,Tauri 跨源加载封面才不被 ORB 拦。
    #   nginx 这里不再覆盖 / 追加这两个头(否则重复,或把后端纠正过的类型再判一次)。
    #   ⚠️ 下面这条 add_header 必须留着:本层有 add_header,server 级那组(含 nosniff / CSP)就不会继承下来,
    #   避免和后端的头重复。
    location = /api/proxy {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy "no-referrer" always;
    }

    # WebSocket 代理（统一 /ws/ 前缀）
    location ^~ /ws/ {
        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT, X-Mx-ReqToken, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization, X-Request-ID, X-CSRF-Token';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # /logs/* → logtail-server (APISIX 上游)
    #   logtail 是独立服务,聚合各业务服务的日志
    location ^~ /logs/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT, X-Mx-ReqToken, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization, X-Request-ID, X-CSRF-Token';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO public bucket(封面/图片/音频/视频/小说正文)→ APISIX → minio:9000
    #   对外只暴露 APISIX,MinIO 自己的 10000 端口在公网不可达;后端存的直链
    #   现在是 https://<域名>/qq-media/...,和 /api 一样从这里进 APISIX。
    # ⚠️ 必须用 ^~:下面那条 \.(js|css|png|jpg|...)$ 是正则 location,优先级高于
    #   普通前缀 location,不加 ^~ 的话 /qq-media/xxx.jpg 会被它抢走、当本地静态
    #   文件找 → 404。^~ 命中后 nginx 不再尝试正则。
    location ^~ /qq-media/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /qq-audio/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 视频/音频体积大且客户端会发 Range 请求,读超时放宽、关掉缓冲直接透传
    location ^~ /qq-video/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /qq-text/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # private bucket(数字人素材 qq-avatar / 临时产物 qq-tmp):路径开放,内容不开放
    #   —— 没有后端签发的 presigned 签名,MinIO 自己就返回 403。
    # ⚠️ Host 必须原样带到 MinIO(proxy_set_header Host $host):签名是按对外域名算的。
    location ^~ /qq-avatar/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /qq-tmp/ {
        proxy_pass http://10.9.1.2:10005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 同 server 块顶部的安全头(本层有 add_header 就不再继承上层)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https: wss:; frame-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # 不缓存 HTML(SPA 回退的 /index.html 也落在这里)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # 同 server 块顶部的安全头(本层有 add_header 就不再继承上层)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https: wss:; frame-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
